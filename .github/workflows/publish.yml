name: Publish nginx base image to GHCR

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile.nginx'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ghcr.io/remardo/dorren-dealers-nginx/nginx:alpine
